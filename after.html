<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAW GAME - التثبيت الأول</title>
<style>
  html,body{margin:0;padding:0;background:#0b0d10;color:#e6ebf2;font:16px/1.6 "Segoe UI",Tahoma,sans-serif;min-height:100%}
  #brand{text-align:center;padding:12px 10px;background:#0e1116;border-bottom:1px solid #1e2732}
  #brand img{width:34px;height:34px;margin-left:8px;border-radius:50%;vertical-align:middle}
  #brand b{font-size:16px;letter-spacing:.10em;vertical-align:middle}
  .card{max-width:560px;margin:12vh auto 0;padding:28px 24px;background:#11151b;border:1px solid #1e2732;border-radius:12px;text-align:center}
  h1{margin:0 0 10px;font-size:25px}.sub{color:#aab4c2;margin:0 0 22px}
  button{width:100%;border:0;border-radius:8px;padding:15px 18px;font-size:17px;font-weight:700;cursor:pointer;background:#e6ebf2;color:#0b0d10}
  #status{min-height:28px;margin-top:16px;color:#7fd0a0;font-weight:700}
  .hint{margin-top:20px;color:#6f7a89;font-size:13px}
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt=""><b>RAW GAME</b></div>
<div class="card">
  <h1>التثبيت الأول</h1>
  <p class="sub">تظهر هذه الصفحة فقط إلى أن تؤكد أن التطبيق تم تثبيته على الجهاز.</p>
  <button id="done">تم تثبيت التطبيق — لا تظهر هذه الصفحة مرة أخرى</button>
  <div id="status"></div>
  <div class="hint">إذا حذفت التطبيق لاحقًا، افتح هذه الصفحة مع <b>?reset=1</b> لإعادة إظهارها بعد التفعيل.</div>
</div>
<script>
(function(){
  var KEY = "rawgame_store_installed_v1";
  var status = document.getElementById("status");
  try {
    if (new URLSearchParams(location.search).get("reset") === "1") {
      localStorage.removeItem(KEY);
      status.textContent = "تمت إعادة الضبط. ستظهر صفحة التثبيت بعد نجاح التفعيل القادم.";
    } else if (localStorage.getItem(KEY) === "1") {
      status.textContent = "هذه الصفحة معلّمة كمكتملة بالفعل.";
    }
  } catch(e) {}
  document.getElementById("done").addEventListener("click", function(){
    try {
      localStorage.setItem(KEY, "1");
      status.textContent = "تم الحفظ. لن تظهر هذه الصفحة في مرات التفعيل القادمة.";
    } catch(e) {
      status.textContent = "تعذر حفظ العلامة في المتصفح.";
    }
  });
})();
</script>
</body>
</html>
